<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PawPal AI - Register</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; overflow-y: auto; min-height: 100vh; margin: 0; }
    .bg-video { position: fixed; top: 0; left: 0; min-width: 100%; min-height: 100%; z-index: -1; object-fit: cover; }
    
    /* Layout Wrapper */
    .page-wrapper {
      display: flex;
      width: 100%;
      min-height: 100vh;
    }
    
    .left-visual {
      flex: 1;
      /* Remains transparent so the video shows through clearly on the left */
    }
    
    .right-auth {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    @media (max-width: 768px) {
      .left-visual {
        display: none;
      }
      .right-auth {
        width: 100%;
      }
    }
    
    .auth-container {
      width: 100%;
      max-width: 500px;
      background: rgba(245, 222, 179, 0.95); border-radius: 15px; padding: 30px; text-align: center;
      box-shadow: 0 0 20px 6px rgba(87, 45, 25, 0.793); animation: glowAround 2s ease-in-out infinite alternate;
    }
    .auth-header { color: #8b4513; font-size: 24px; font-weight: bold; margin-bottom: 5px; }
    .auth-subtitle { color: #5c3a21; font-size: 13px; margin-bottom: 20px; }
    
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group.full { grid-column: span 2; }
    .form-group label { display: block; font-size: 12px; color: #8b4513; margin-bottom: 5px; font-weight: 600; }
    .form-control { width: 100%; padding: 10px; border: none; border-radius: 10px; outline: none; background: rgba(255, 255, 255, 0.7); color: black; font-family: 'Poppins', sans-serif; }
    
    .btn {
      width: 100%; background: #8b4513; color: white; border: none; padding: 12px; border-radius: 20px; font-size: 16px; cursor: pointer; transition: background 0.3s ease, box-shadow 0.3s ease; margin-top: 10px; font-family: 'Poppins', sans-serif;
    }
    .btn:hover { background: #a0522d; box-shadow: 0 0 10px #ffa500, 0 0 20px #ffa500; }
    .links { margin-top: 15px; font-size: 13px; }
    .links a { color: #8b4513; text-decoration: none; font-weight: 600; margin: 0 5px; }
    .links a:hover { text-decoration: underline; }
    .error-message { color: red; font-size: 13px; margin-bottom: 10px; display: none; }
    
    @keyframes glowAround {
      0% { box-shadow: 0 0 20px 6px rgba(87, 45, 25, 0.793); }
      100% { box-shadow: 0 0 30px 10px rgba(87, 45, 25, 0.793); }
    }
    
    @media (max-width: 500px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-group.full { grid-column: span 1; }
    }
  </style>
</head>
<body>

  <video autoplay muted loop class="bg-video">
    <source src="/static/video/dog_bg.mp4" type="video/mp4">
  </video>

  <div class="page-wrapper">
    <div class="left-visual"></div>
    <div class="right-auth">
      <div class="auth-container">
        <div class="auth-header">Create Account</div>
        <div class="auth-subtitle">Start smarter care for your pet today.</div>
        <div id="error-msg" class="error-message"></div>
        
        <form id="register-form">
          <div class="form-grid">
            <div class="form-group full">
              <label>Owner Name</label>
              <input type="text" id="name" class="form-control" required>
            </div>
            <div class="form-group full">
              <label>Email</label>
              <input type="email" id="email" class="form-control" required>
            </div>
            <div class="form-group">
              <label>Password</label>
              <input type="password" id="password" class="form-control" required minlength="6">
            </div>
            <div class="form-group">
              <label>Confirm Password</label>
              <input type="password" id="confirm_password" class="form-control" required minlength="6">
            </div>
            <div class="form-group">
              <label>Dog's Name</label>
              <input type="text" id="dogName" class="form-control" required>
            </div>
            <div class="form-group">
              <label>Dog's Breed</label>
              <input type="text" id="dogBreed" class="form-control">
            </div>
            <div class="form-group full">
              <label>Dog's Age (Years)</label>
              <input type="number" id="dogAge" class="form-control" min="0" step="0.1">
            </div>
          </div>
          <button type="submit" class="btn" id="register-btn">Create Account</button>
        </form>
        
        <div class="links">
          <a href="/login">Already have an account? Login</a><br><br>
          <a href="/">Back to Home</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    if (localStorage.getItem("token")) { window.location.href = "/chatbot"; }

    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const confirm_password = document.getElementById("confirm_password").value;
      const dogName = document.getElementById("dogName").value;
      const dogBreed = document.getElementById("dogBreed").value;
      const dogAge = document.getElementById("dogAge").value;
      
      const errorMsg = document.getElementById("error-msg");
      const btn = document.getElementById("register-btn");
      
      if (password !== confirm_password) {
        errorMsg.textContent = "Passwords do not match.";
        errorMsg.style.display = "block";
        return;
      }

      btn.textContent = "Registering...";
      btn.disabled = true;
      errorMsg.style.display = "none";

      try {
        const response = await fetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, password, dogName, dogBreed, dogAge })
        });
        const data = await response.json();
        
        if (response.ok) {
          localStorage.setItem("token", data.token);
          window.location.href = "/chatbot";
        } else {
          errorMsg.textContent = data.error || "Registration failed";
          errorMsg.style.display = "block";
          btn.textContent = "Create Account";
          btn.disabled = false;
        }
      } catch (err) {
        errorMsg.textContent = "Server error. Please try again.";
        errorMsg.style.display = "block";
        btn.textContent = "Create Account";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
