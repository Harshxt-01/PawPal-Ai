<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PawPal AI - Reset Password</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; overflow: hidden; height: 100vh; margin: 0; }
    .bg-video { position: fixed; top: 0; left: 0; min-width: 100%; min-height: 100%; z-index: -1; object-fit: cover; }
    
    /* Layout Wrapper */
    .page-wrapper {
      display: flex;
      width: 100%;
      height: 100vh;
    }
    
    .left-visual {
      flex: 1;
      /* Remains transparent so the video shows through clearly on the left */
    }
    
    .right-auth {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    @media (max-width: 768px) {
      .left-visual {
        display: none;
      }
      .right-auth {
        width: 100%;
      }
    }
    
    .auth-container {
      width: 100%; max-width: 400px; background: rgba(245, 222, 179, 0.9); border-radius: 15px; padding: 30px; text-align: center;
      box-shadow: 0 0 20px 6px rgba(87, 45, 25, 0.793); animation: glowAround 2s ease-in-out infinite alternate;
    }
    .auth-header { color: #8b4513; font-size: 24px; font-weight: bold; margin-bottom: 5px; }
    .auth-subtitle { color: #5c3a21; font-size: 13px; margin-bottom: 20px; }
    
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { display: block; font-size: 13px; color: #8b4513; margin-bottom: 5px; font-weight: 600; }
    .form-control { width: 100%; padding: 10px; border: none; border-radius: 10px; outline: none; background: rgba(255, 255, 255, 0.7); color: black; font-family: 'Poppins', sans-serif; }
    
    .btn {
      width: 100%; background: #8b4513; color: white; border: none; padding: 12px; border-radius: 20px; font-size: 16px; cursor: pointer; transition: background 0.3s ease, box-shadow 0.3s ease; margin-top: 10px; font-family: 'Poppins', sans-serif;
    }
    .btn:hover { background: #a0522d; box-shadow: 0 0 10px #ffa500, 0 0 20px #ffa500; }
    .links { margin-top: 15px; font-size: 13px; }
    .links a { color: #8b4513; text-decoration: none; font-weight: 600; margin: 0 5px; }
    .links a:hover { text-decoration: underline; }
    .message { font-size: 13px; margin-bottom: 10px; display: none; }
    .message.error { color: red; }
    .message.success { color: green; font-weight: bold; }
    
    @keyframes glowAround {
      0% { box-shadow: 0 0 20px 6px rgba(87, 45, 25, 0.793); }
      100% { box-shadow: 0 0 30px 10px rgba(87, 45, 25, 0.793); }
    }
  </style>
</head>
<body>

  <video autoplay muted loop class="bg-video">
    <source src="/static/video/dog_bg.mp4" type="video/mp4">
  </video>

  <div class="page-wrapper">
    <div class="left-visual"></div>
    <div class="right-auth">
      <div class="auth-container">
        <div class="auth-header">Reset Password</div>
        <div class="auth-subtitle">Enter your new password below.</div>
        <div id="status-msg" class="message"></div>
        
        <form id="reset-form">
          <div class="form-group">
            <label>New Password</label>
            <input type="password" id="password" class="form-control" required minlength="6">
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="confirm_password" class="form-control" required minlength="6">
          </div>
          <button type="submit" class="btn" id="reset-btn">Reset Password</button>
        </form>
        
        <div class="links">
          <a href="/login">Back to Login</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("reset-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = document.getElementById("password").value;
      const confirm_password = document.getElementById("confirm_password").value;
      const statusMsg = document.getElementById("status-msg");
      const btn = document.getElementById("reset-btn");
      
      if (password !== confirm_password) {
        statusMsg.textContent = "Passwords do not match.";
        statusMsg.classList.add("error");
        statusMsg.style.display = "block";
        return;
      }

      btn.textContent = "Resetting...";
      btn.disabled = true;
      statusMsg.style.display = "none";
      statusMsg.className = "message";

      // The token should be injected into a JS variable by Flask or parsed from the URL
      const pathParts = window.location.pathname.split('/');
      const token = pathParts[pathParts.length - 1];

      try {
        const response = await fetch(`/api/auth/reset-password/${token}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password })
        });
        const data = await response.json();
        
        if (response.ok) {
          statusMsg.textContent = "Password reset successful! You can now login.";
          statusMsg.classList.add("success");
          statusMsg.style.display = "block";
          btn.style.display = "none";
        } else {
          statusMsg.textContent = data.error || "Reset failed. Token may be invalid or expired.";
          statusMsg.classList.add("error");
          statusMsg.style.display = "block";
          btn.textContent = "Reset Password";
          btn.disabled = false;
        }
      } catch (err) {
        statusMsg.textContent = "Server error. Please try again.";
        statusMsg.classList.add("error");
        statusMsg.style.display = "block";
        btn.textContent = "Reset Password";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
